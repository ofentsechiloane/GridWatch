<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GridWatch: Is it just me?</title>
    <style>
        :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8;
                --red:#ef4444; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
        main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
        h1 { margin: 0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
        .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; }
        .row { display:flex; gap:8px; flex-wrap:wrap; }
        input { flex:1; min-width:120px; padding:8px; border-radius:8px; border:1px solid #334155;
                background:#0f172a; color:var(--text); }
        button { padding:10px 14px; border:0; border-radius:8px; font-weight:600; cursor:pointer; color:#fff; background:var(--blue); }
        button.off { background:var(--red); } button.unstable { background:var(--amber); }
        button.on, button.restored { background:var(--green); }
        #verdict { border-left:6px solid var(--muted); }
        #verdict.OUTAGE_IN_AREA { border-color:var(--red); }
        #verdict.LIKELY_JUST_YOU { border-color:var(--amber); }
        #verdict.NOT_ENOUGH_DATA { border-color:var(--muted); }
        #verdict h2 { margin:0 0 6px; }
        .muted { color:var(--muted); font-size:.9rem; }
        ul { list-style:none; padding:0; margin:0; }
        li { padding:8px 0; border-bottom:1px solid #334155; } li:last-child { border:0; }
        .tag { padding:2px 8px; border-radius:999px; font-size:.75rem; font-weight:700; background:#334155; }
        .CONFIRMED { background:var(--red); } .LIKELY { background:var(--amber); } .POSSIBLE { background:var(--blue); }
    </style>
</head>
<body>
<main>
    <h1>GridWatch</h1>
    <p class="sub">Is it just your house, or is the whole area down?</p>

    <section class="card">
        <div class="row">
            <input id="lat" type="number" step="any" placeholder="Latitude" value="-26.2041">
            <input id="lon" type="number" step="any" placeholder="Longitude" value="28.0473">
            <button id="locate" type="button">Use my location</button>
        </div>
        <p class="muted" id="locMsg">Defaults to central Johannesburg.</p>
        <button id="check" type="button">Is it just me?</button>
    </section>

    <section class="card" id="verdict" hidden>
        <h2 id="vTitle"></h2>
        <p id="vMsg"></p>
        <p class="muted" id="vStats"></p>
    </section>

    <section class="card">
        <strong>Report your power status</strong>
        <p class="muted">Your report helps neighbours get an answer.</p>
        <div class="row">
            <button class="off" data-status="OFF">Power OFF</button>
            <button class="unstable" data-status="UNSTABLE">Unstable</button>
            <button class="on" data-status="ON">Power ON</button>
            <button class="restored" data-status="RESTORED">Restored</button>
        </div>
        <p class="muted" id="reportMsg"></p>
    </section>

    <section class="card">
        <strong>Active outages</strong>
        <ul id="outages"><li class="muted">Loading...</li></ul>
    </section>
</main>

<script>
    const $ = (id) => document.getElementById(id);
    const TITLES = {
      OUTAGE_IN_AREA: "Not just you: outage in your area",
      LIKELY_JUST_YOU: "Probably just your property",
      NOT_ENOUGH_DATA: "Not enough data yet"
    };

    function coords() {
      const lat = parseFloat($("lat").value), lon = parseFloat($("lon").value);
      if (Number.isNaN(lat) || Number.isNaN(lon)) throw new Error("Enter a valid latitude and longitude.");
      return { lat, lon };
    }

    async function api(path, options) {
      const res = await fetch(path, options);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.message || "Request failed (" + res.status + ")");
      return body;
    }

    async function checkJustMe() {
      try {
        const { lat, lon } = coords();
        const v = await api("/api/outages/just-me?lat=" + lat + "&lon=" + lon);
        $("verdict").hidden = false;
        $("verdict").className = "card " + v.verdict;
        $("vTitle").textContent = TITLES[v.verdict];
        $("vMsg").textContent = v.message;
        $("vStats").textContent = v.offReports + " OFF/UNSTABLE and " + v.onReports +
          " ON/RESTORED reports within " + v.radiusMeters + " m in the last " + v.minutes + " min.";
      } catch (e) { alert(e.message); }
    }

    async function sendReport(status) {
      try {
        const { lat, lon } = coords();
        await api("/api/reports", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status, latitude: lat, longitude: lon })
        });
        $("reportMsg").textContent = "Report sent: " + status + ".";
        await Promise.all([checkJustMe(), loadOutages()]);
      } catch (e) { $("reportMsg").textContent = e.message; }
    }

    async function loadOutages() {
      const list = $("outages");
      try {
        const outages = await api("/api/outages");
        list.replaceChildren();
        if (outages.length === 0) {
          const li = document.createElement("li");
          li.className = "muted";
          li.textContent = "No active outages reported.";
          list.append(li);
          return;
        }
        for (const o of outages) {
          const li = document.createElement("li");
          const tag = document.createElement("span");
          tag.className = "tag " + o.status;
          tag.textContent = o.status;
          li.append(tag, " " + o.reportCount + " reports, confidence " + Math.round(o.confidence * 100) +
            "%, near " + o.centerLatitude.toFixed(3) + ", " + o.centerLongitude.toFixed(3));
          list.append(li);
        }
      } catch (e) { list.textContent = e.message; }
    }

    $("check").addEventListener("click", checkJustMe);
    $("locate").addEventListener("click", () => {
      if (!navigator.geolocation) { $("locMsg").textContent = "Geolocation is not supported."; return; }
      navigator.geolocation.getCurrentPosition(
        (p) => { $("lat").value = p.coords.latitude.toFixed(5); $("lon").value = p.coords.longitude.toFixed(5);
                 $("locMsg").textContent = "Using your location."; },
        () => { $("locMsg").textContent = "Could not get your location. Enter it manually."; });
    });
    document.querySelectorAll("[data-status]").forEach((b) =>
      b.addEventListener("click", () => sendReport(b.dataset.status)));

    loadOutages();
    setInterval(loadOutages, 30000);
</script>
</body>
</html>
