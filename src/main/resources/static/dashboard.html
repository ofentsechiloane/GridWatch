<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GridWatch Dashboard</title>
    <script src="js/theme.js"></script>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="./">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
            <span>GridWatch</span>
        </a>
        <nav class="nav">
            <a href="./">Check</a>
            <a href="dashboard.html" aria-current="page">Dashboard</a>
        </nav>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
            <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    </div>
</header>

<main class="container">
    <div class="page-head">
        <div>
            <h1>Dashboard</h1>
            <p class="muted live" id="updated">Loading...</p>
            <p class="error" id="err"></p>
        </div>
        <button id="refresh" type="button" class="btn btn-ghost">Refresh</button>
    </div>

    <div class="stats">
        <div class="stat"><span class="stat-label"><i class="dot dot-green"></i>Active outages</span><span class="stat-n" id="sActive">0</span></div>
        <div class="stat"><span class="stat-label"><i class="dot dot-red"></i>Confirmed</span><span class="stat-n" id="sConfirmed">0</span></div>
        <div class="stat"><span class="stat-label"><i class="dot dot-amber"></i>Likely</span><span class="stat-n" id="sLikely">0</span></div>
        <div class="stat"><span class="stat-label"><i class="dot dot-blue"></i>Possible</span><span class="stat-n" id="sPossible">0</span></div>
        <div class="stat"><span class="stat-label">Reports in outages</span><span class="stat-n" id="sReports">0</span></div>
        <div class="stat"><span class="stat-label">Avg confidence</span><span class="stat-n" id="sConf">0%</span></div>
    </div>

    <div class="stack">
        <section class="card">
            <div class="card-head"><h2>Active outages</h2></div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Status</th><th>Reports</th><th>Confidence</th><th>Radius</th><th>Location</th><th>Started</th><th>Updated</th></tr></thead>
                    <tbody id="outageRows"></tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Recent reports</h2>
                <div class="chips" id="chips"></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Status</th><th>Location</th><th>Description</th><th>When</th></tr></thead>
                    <tbody id="reportRows"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<script>
    const $ = (id) => document.getElementById(id);
    const FILTERS = [["ALL", "All"], ["OFF", "Off"], ["UNSTABLE", "Unstable"], ["ON", "On"], ["RESTORED", "Restored"]];
    let reports = [];
    let filter = "ALL";

    async function api(path) {
      const res = await fetch((window.API_BASE || "") + path);
      if (!res.ok) throw new Error("Request failed (" + res.status + ")");
      return res.json();
    }

    function ago(iso) {
      const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
      if (s < 60) return s + "s ago";
      if (s < 3600) return Math.floor(s / 60) + "m ago";
      if (s < 86400) return Math.floor(s / 3600) + "h ago";
      return Math.floor(s / 86400) + "d ago";
    }

    function td(content) {
      const el = document.createElement("td");
      if (content instanceof Node) el.append(content); else el.textContent = content;
      return el;
    }

    function tag(status) {
      const el = document.createElement("span");
      el.className = "tag " + status;
      el.textContent = status;
      return el;
    }

    function confBar(c) {
      const bar = document.createElement("span");
      bar.className = "bar";
      const fill = document.createElement("span");
      fill.style.width = Math.round(c * 100) + "%";
      bar.append(fill);
      const wrap = document.createElement("span");
      wrap.append(bar, Math.round(c * 100) + "%");
      return wrap;
    }

    function emptyRow(tbody, cols, text) {
      const tr = document.createElement("tr");
      const cell = td(text);
      cell.colSpan = cols;
      cell.className = "empty";
      tr.append(cell);
      tbody.append(tr);
    }

    function renderStats(outages) {
      const count = (s) => outages.filter((o) => o.status === s).length;
      $("sActive").textContent = outages.length;
      $("sConfirmed").textContent = count("CONFIRMED");
      $("sLikely").textContent = count("LIKELY");
      $("sPossible").textContent = count("POSSIBLE");
      $("sReports").textContent = outages.reduce((a, o) => a + o.reportCount, 0);
      const avg = outages.length ? outages.reduce((a, o) => a + o.confidence, 0) / outages.length : 0;
      $("sConf").textContent = Math.round(avg * 100) + "%";
    }

    function renderOutages(outages) {
      const body = $("outageRows");
      body.replaceChildren();
      if (outages.length === 0) return emptyRow(body, 7, "No active outages. All quiet.");
      const sorted = [...outages].sort((a, b) => b.confidence - a.confidence ||
        new Date(b.updatedAt) - new Date(a.updatedAt));
      for (const o of sorted) {
        const tr = document.createElement("tr");
        tr.append(
          td(tag(o.status)),
          td(o.reportCount),
          td(confBar(o.confidence)),
          td(Math.round(o.radiusMeters) + " m"),
          td(o.centerLatitude.toFixed(4) + ", " + o.centerLongitude.toFixed(4)),
          td(ago(o.startedAt)),
          td(ago(o.updatedAt))
        );
        body.append(tr);
      }
    }

    function renderChips() {
      const box = $("chips");
      box.replaceChildren();
      for (const [key, label] of FILTERS) {
        const n = key === "ALL" ? reports.length : reports.filter((r) => r.status === key).length;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = label + " (" + n + ")";
        b.setAttribute("aria-pressed", String(filter === key));
        b.addEventListener("click", () => { filter = key; renderChips(); renderReports(); });
        box.append(b);
      }
    }

    function renderReports() {
      const body = $("reportRows");
      body.replaceChildren();
      const shown = filter === "ALL" ? reports : reports.filter((r) => r.status === filter);
      if (shown.length === 0) return emptyRow(body, 4, "No reports to show.");
      for (const r of shown) {
        const tr = document.createElement("tr");
        tr.append(
          td(tag(r.status)),
          td(r.latitude.toFixed(4) + ", " + r.longitude.toFixed(4)),
          td(r.description || "-"),
          td(ago(r.createdAt))
        );
        body.append(tr);
      }
    }

    async function load() {
      const btn = $("refresh");
      btn.disabled = true;
      try {
        const [outages, latest] = await Promise.all([
          api("/api/outages"),
          api("/api/reports?page=0&size=50")
        ]);
        reports = latest;
        renderStats(outages);
        renderOutages(outages);
        renderChips();
        renderReports();
        $("updated").textContent = "Live, updated " + new Date().toLocaleTimeString();
        $("err").textContent = "";
      } catch (e) { $("err").textContent = e.message; }
      btn.disabled = false;
    }

    $("refresh").addEventListener("click", load);
    load();
    setInterval(load, 30000);
</script>
</body>
</html>
