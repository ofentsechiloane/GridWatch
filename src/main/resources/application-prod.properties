spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# No default: the app refuses to start without it
gridwatch.admin-key=${ADMIN_KEY}

server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# One JSON log line per event
logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.com.gridwatch=INFO