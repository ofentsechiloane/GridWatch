spring.application.name=gridwatch

# Database (these defaults match docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gridwatch}
spring.datasource.username=${DB_USER:gridwatch}
spring.datasource.password=${DB_PASSWORD:gridwatch}

# Let Hibernate create/update tables while we build
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Only expose the health endpoint from Actuator
management.endpoints.web.exposure.include=health