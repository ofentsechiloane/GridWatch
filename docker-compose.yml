services:
  db:
    image: postgres:16
    container_name: gridwatch-db
    environment:
      POSTGRES_DB: gridwatch
      POSTGRES_USER: gridwatch
      POSTGRES_PASSWORD: gridwatch
    ports:
      - "5432:5432"
    volumes:
      - gridwatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridwatch -d gridwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: gridwatch-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gridwatch
      DB_USER: gridwatch
      DB_PASSWORD: gridwatch
    ports:
      - "8080:8080"

volumes:
  gridwatch-data: