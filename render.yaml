services:
  - type: web
    name: gridwatch
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      - key: DB_PORT
        value: "5432"
      - key: DB_PARAMS
        value: "?sslmode=require"
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_KEY
        generateValue: true